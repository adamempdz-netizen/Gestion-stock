name: Build Gestion Stock Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm install

      - name: Construire l'application Windows
        run: npm run build

      - name: Publier le fichier EXE
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Stock-Windows
          path: |
            dist/**/*.exe
            release/**/*.exe
